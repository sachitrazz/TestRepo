[package]
name = "vfsd-filter-daemon"
version = "0.2.0"
edition = "2021"
description = "virtiofsd v1.14.0 main with the vfsd-filter decorator around the passthrough backend"
license = "Apache-2.0 AND BSD-3-Clause"
publish = false

[[bin]]
name = "virtiofsd-filtered"
path = "src/main.rs"

[dependencies]
virtiofsd = "=1.14.0"
vfsd-filter = { path = "../vfsd-filter-0.2.0" }
capng = "0.2.2"
clap = { version = "4", features = ["derive"] }
env_logger = "0.8.4"
libc = "0.2.177"
log = "0.4"
syslog = "6.1"
vhost = "0.16"
vhost-user-backend = "0.22"
vm-memory = { version = "=0.17.1", features = ["backend-mmap", "backend-atomic"] }
vmm-sys-util = "0.15.0"

[profile.release]
lto = true
